---
- name: Configure Apache Web Server
  hosts: webservers
  vars_files:
    - ../group_vars/all.yml
  become: yes

  tasks:
    - name: Install Apache
      apt:
        name: "{{ apache_package }}"
        state: present
        update_cache: yes

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create admin user
      user:
        name: "{{ admin_user }}"
        groups: sudo
        append: yes
        state: present
    - name: Deploy company homepage
      template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
